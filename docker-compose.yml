version: '3.8'

services:
  miko-music-bot:
    build: .
    container_name: miko_discord_music
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
    volumes:
      - ./config.json:/usr/src/app/config.json
      - ./logs:/usr/src/app/logs
