<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Miko Music - Admin</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #1e1e2e; color: #cdd6f4; padding: 2rem; max-width: 950px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .card { background: #313244; padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem; }
        .card.full { grid-column: span 2; }
        input { width: calc(100% - 1rem); padding: 0.5rem; margin: 0.2rem 0; background: #181825; border: 1px solid #45475a; color: white; border-radius: 4px; }
        button { background: #89b4fa; color: #11111b; padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 0.5rem; }
        button:hover { background: #74c7ec; }
        .btn-success { background: #a6e3a1; color: #11111b; }
        .btn-danger { background: #f38ba8; }
        .btn-warning { background: #f9e2af; color:#11111b; }
        .controls-row { display: flex; gap: 1rem; margin-top: 1rem; flex-wrap: wrap; }
        .pl-item { background: #181825; padding: 0.5rem; margin-top: 0.5rem; border-radius: 4px; display: flex; align-items: center; gap: 0.5rem;}
        .pl-item input { margin: 0; width: 45%; }
        .drag-handle { cursor: grab; font-size: 1.2rem; padding: 0 0.5rem; }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h1>🎛️ Miko Music Dashboard</h1>
        <button class="btn-success" onclick="openDiscordInvite()">➕ Invite Bot to Server</button>
    </div>
    
    <div class="card full" style="border-left: 4px solid #f9e2af;">
        <h3>Live Audio Overrides</h3>
        <div class="controls-row">
            <button onclick="controlPlayer('back')">⏮️ Back</button>
            <button onclick="controlPlayer('pause')">⏯️ Play / Pause</button>
            <button onclick="controlPlayer('skip')">⏭️ Skip</button>
            <button onclick="controlPlayer('shuffle')" class="btn-warning">🔀 Shuffle Queue</button>
            <button onclick="controlPlayer('loopTrack')" class="btn-success">🔂 Loop Track</button>
            <button onclick="controlPlayer('loopQueue')" class="btn-success">🔁 Loop Queue</button>
            <button onclick="controlPlayer('loopOff')" class="btn-danger">❌ Loop Off</button>
            <button onclick="controlPlayer('stop')" class="btn-danger">⏹️ Stop & Disconnect</button>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h3>Permissions (Security)</h3>
            <label>Admin User IDs:</label>
            <input type="text" id="adminUsers">
            <label>Admin Role IDs:</label>
            <input type="text" id="adminRoles">
            <button onclick="updateSettings()">Save Permissions</button>
        </div>

        <div class="card">
            <h3>Playlist Manager (Notepad)</h3>
            <p style="font-size: 0.85rem; color:#a6adc8;">Edit your saved playlists for the /summon menu below. Click Save to push changes.</p>
            <div id="plContainer"></div>
            <button onclick="addEmptyPlaylistRow()" class="btn-success">+ Add Row</button>
            <button onclick="savePlaylists()">💾 Save All Playlists</button>
        </div>
    </div>
    
    <script>
        let cachedPlaylists = [];

        function loadConfig() {
            fetch('/api/config').then(r => r.json()).then(data => {
                document.getElementById('adminUsers').value = (data.adminUsers || []).join(', ');
                document.getElementById('adminRoles').value = (data.adminRoles || []).join(', ');
                cachedPlaylists = data.savedPlaylists || [];
                renderPlaylists();
            });
        }

        function renderPlaylists() {
            const container = document.getElementById('plContainer');
            container.innerHTML = '';
            cachedPlaylists.forEach((pl, index) => {
                container.innerHTML += `
                    <div class="pl-item" id="pl-${index}">
                        <span class="drag-handle">↕️</span>
                        <input type="text" value="${pl.name}" id="pl-name-${index}" placeholder="Name">
                        <input type="text" value="${pl.url}" id="pl-url-${index}" placeholder="URL">
                        <button class="btn-danger" style="margin:0;" onclick="removePlaylistRow(${index})">X</button>
                    </div>
                `;
            });
        }

        function addEmptyPlaylistRow() {
            cachedPlaylists.push({ name: '', url: '' });
            renderPlaylists();
        }

        function removePlaylistRow(index) {
            cachedPlaylists.splice(index, 1);
            renderPlaylists();
        }

        function savePlaylists() {
            const newPlaylists = [];
            for (let i = 0; i < cachedPlaylists.length; i++) {
                const n = document.getElementById(`pl-name-${i}`)?.value;
                const u = document.getElementById(`pl-url-${i}`)?.value;
                if (n && u) newPlaylists.push({ name: n, url: u });
            }
            fetch('/api/playlists', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ playlists: newPlaylists })
            }).then(() => {
                alert('Playlists saved successfully!');
                loadConfig();
            });
        }
        
        loadConfig();
        
        function openDiscordInvite() {
            fetch('/api/config').then(r => r.json()).then(data => {
                const id = data.clientId || prompt("Paste your Application ID:");
                if (!id) return; 
                window.open(`https://discord.com/oauth2/authorize?client_id=${id}&permissions=3148800&scope=bot%20applications.commands`, 'popup', 'width=500,height=750');
            });
        }

        function updateSettings() {
            fetch('/api/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    adminUsers: document.getElementById('adminUsers').value,
                    adminRoles: document.getElementById('adminRoles').value
                })
            }).then(() => alert('Permissions saved.'));
        }

        function controlPlayer(action) {
            fetch('/api/control', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action }) })
            .then(r => r.json()).then(res => { if(!res.success) alert(res.message); });
        }
    </script>
</body>
</html>
